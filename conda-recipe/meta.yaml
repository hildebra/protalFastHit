{% set version = "0.8.2" %}  # keep in sync with project(... VERSION) in CMakeLists.txt

package:
  name: protal
  version: {{ version }}

source:
  # The local checkout, as the README's build instructions describe.
  path: ..

build:
  number: 0
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}   # C++20 with OpenMP; GCC 13 and 14 are tested
    - {{ stdlib('c') }}
    - cmake >=3.22
    - make
    - nasm >=2.14.01          # ISA-L's assembly (lib/isa-l, built and linked in: gzip read and written)
  host:
    - zstd                    # database.protal and its compressed parts, .sam.zst
    - libgomp                 # OpenMP
  run:
    - python >=3.8            # qcmsa (standard library only), protal_map_utils, protal_profile_utils
    - libgomp
    - matplotlib-base         # only for qcmsa --plot
    # zstd comes with its run_exports; zlib-ng, ISA-L and rapidgzip are vendored and linked in (lib/).
    # Building and training a database needs more (numpy, pandas, scikit-learn, NCBI datasets):
    # see envs/protal-db-build.yaml.

test:
  commands:
    - protal --version
    - simulate_metagenomes --help
    - qcmsa --help
    - protal_map_utils --help
    - protal_profile_utils --help
    - test -f $PREFIX/share/protal/scripts/build_gtdb_database.py

about:
  home: https://github.com/4less/protal
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Reference-based taxonomic and strain-level profiler for shotgun metagenomes (GTDB marker genes).

extra:
  channels:
    - conda-forge    # high priority
    - bioconda
