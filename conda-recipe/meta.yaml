package:
  name: protal
  version: "0.6.0"  # keep in sync with project(... VERSION) in CMakeLists.txt

source:
  # The local checkout, as the README's build instructions describe.
  path: ..

requirements:
  build:
    - cmake
    - make
    - gcc_linux-64 >=14.2.0
    - gxx_linux-64 >=14.2.0
    - libgomp >=14.2.0
    - zlib
    - zstd    # compressed database files (index.prx.zst, reference.fna.zst), .sam.zst
    - libdeflate    # gzip as protal writes it (BGZF .sam.gz, simulated reads) and BGZF input
  run:
    - python >=3
    - zstd
    - libdeflate

about:
  home: https://github.com/4less/protal
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Reference-based taxonomic and strain-level profiler for shotgun metagenomes (GTDB marker genes).

channels:
  - conda-forge    # High priority channel
  - bioconda
