name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libgtest-dev libzstd-dev libdeflate-dev zstd python3 python3-numpy

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPROTAL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --target protal simulate_metagenomes protal_tests

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Mini database generator tests
        run: python3 -m unittest -v scripts/mini_db/test_mini_db.py

      - name: In-silico strain and trace tests
        run: python3 -m unittest -v scripts/test_insilico_strains.py scripts/test_trace_relatives.py

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libgtest-dev libzstd-dev libdeflate-dev

      # Debug: asserts on. ASan + UBSan with leak checking.
      - name: Configure
        run: |
          FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPROTAL_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="$FLAGS" -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"

      - name: Build
        run: cmake --build build-asan --target protal_tests

      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure
